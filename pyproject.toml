[build-system]
requires = [
  "setuptools>=69",
  "wheel",
  "pybind11>=2.6.0",
  "numpy>=1.19.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "alphasimpy"
version = "0.2.0"
description = "AlphaSimPy with standalone C++ bindings for MaCS simulation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.19.0",
  "pybind11>=2.6.0",
]
