[build-system]
requires = [
  "setuptools>=69",
  "wheel",
  "pybind11>=2.6.0",
  "numpy>=1.19.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "alphasimpy"
version = "0.3.0"
description = "AlphaSimPy: AlphaSimR-aligned breeding simulation (required C++/pybind11 extension)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.19.0",
  "pybind11>=2.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
